<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes" />
    <title>Boom Ragdoll</title>
    <!-- PWA manifest with "ms_start_compatible": true, needed for the Microsoft Partner Center package (MSN Play docs) -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-512.png" />
    <!-- MSN Play games SDK: window.$msstart, used by Assets/_Booonk/Plugins/Msn/Msn.jslib.
         rc.23 is the release Microsoft's docs name as current (2026-11-14); rc.24 and rc.25 exist on their server
         but are not documented. -->
    <script src="https://assets.msn.com/staticsb/statics/latest/msstart-games-sdk/msstart-v1.0.0-rc.23.min.js"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
      }
      #unity-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #diagnostics-icon {
        position: fixed;
        bottom: 10px;
        right: 0;
      }
    </style>
  </head>
  <body>
    <canvas
      id="unity-canvas"
      width="960"
      height="600"
      tabindex="-1"
      style="background: #231F20"
    ></canvas>
    <script src="Build/build.loader.js"></script>
    <script>
            createUnityInstance(document.querySelector("#unity-canvas"), {
              arguments: [],
              dataUrl: "Build/build.data.unityweb",
              frameworkUrl: "Build/build.framework.js.unityweb",
              codeUrl: "Build/build.wasm.unityweb",
              streamingAssetsUrl: "StreamingAssets",
              companyName: "Karbasha Studio",
              productName: "Boom Ragdoll",
              productVersion: "1.2.1",
              // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
              // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
            }).then((unityInstance) => {
            }).catch((message) => {
              alert(message);
            });
    </script>
  </body>
</html>
